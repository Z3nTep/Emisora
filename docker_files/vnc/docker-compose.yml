services:
  # ==========================================
  # 1. OBS Studio (VNC Desktop)
  # ==========================================
  emisor:
    build:
      context: .
      dockerfile: docker_files/Dockerfile-VNC # Asegúrate de que esta ruta local coincida si moviste el Dockerfile
    container_name: stream-obs
    volumes:
      # Aplicaciones
      - ./app/auto_media_player:/app
      - ./app/widget_player:/widget_player

      # Directorio Base de OBS (Debe ser escribible para cachés de Chromium y carpetas temporales)
      - ./emision/obs-conf:/headless/.config/obs-studio

      ## 🛡️ MODO INMORTAL: Bóveda de Solo Lectura 
      ## (DESCOMENTAR estas líneas de abajo SOLAMENTE cuando ya hayas configurado tu stream en VNC por primera vez)
      # - type: bind
      #   source: ./emision/obs-conf/global.ini
      #   target: /headless/.config/obs-studio/global.ini
      #   read_only: true
      # - type: bind
      #   source: ./emision/obs-conf/basic
      #   target: /headless/.config/obs-studio/basic
      #   read_only: true

      # Videos para el fondo (solo lectura)
      - type: bind
        source: ./media/videos
        target: /headless/Videos
        read_only: true
      # Medios (Único punto de montaje para OBS y la radio)
      - type: bind
        source: ./media/musica
        target: /headless/Music
        read_only: true
      - type: bind
        source: ./media/imagenes
        target: /headless/Images
        read_only: true
    ports:
      # - "5901:5901" # VNC port
      - "6901:6080" # noVNC web port (mapeado al 6080 interno)
    environment:
      - USER=vncuser
      - HOME=/headless
      - VNC_PW=vncpass
      - VNC_RESOLUTION=1480x920
      - AUTO_STREAM=false
      - AUTO_PLAY_RADIO=true
      - HEADLESS=false  # true = sin VNC (Xvfb invisible, ahorra ~300% CPU) | false = VNC completo
    restart: unless-stopped
    networks:
      - stream-offnet

  # ==========================================
  # 2. Servidor Samba (Almacenamiento en red)
  # ==========================================
  almacen:
    image: dockurr/samba:latest
    container_name: stream-storage
    environment:
      NAME: "Media"
      USER: "User"
      PASS: "Contraseña123"
    ports:
      - "445:445"
    volumes:
      - ./media:/storage
    restart: always
    networks:
      - stream-onnet

  # ========================================== # datarhei/restreamer para X86 
  # 3. Restreamer (Transmisión)
  # ========================================== # datarhei/restreamer-aarch64 para ARM64
  transmisor:
    image: datarhei/restreamer:latest
    container_name: restreamer
    restart: always
    environment:
      - CORE_API_AUTH_USERNAME=admin
      - CORE_API_AUTH_PASSWORD=No
    ports:
      - "8080:8080" # Interfaz Web (HTTP)
      - "8181:8181" # Interfaz Web (HTTPS)
      - "1935:1935" # RTMP
      - "1936:1936" # RTMPS
      - "6000:6000/udp" # SRT
    volumes:
      - ./emision/restreamer/config:/core/config
      - ./emision/restreamer/data:/core/data
    networks:
      - stream-offnet
      - stream-onnet

# ==========================================
# Redes
# ==========================================
networks:
  stream-offnet:
    driver: bridge
  stream-onnet:
    driver: bridge
